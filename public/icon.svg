<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#071829"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#D4AF37" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Center ERP Emblem -->
  <g transform="translate(106, 96)">
    <!-- Building/Vault Pillars -->
    <path d="M150 20 L280 90 L20 90 Z" fill="url(#goldGrad)"/>
    <rect x="40" y="105" width="30" height="110" rx="6" fill="#F8FAFC"/>
    <rect x="100" y="105" width="30" height="110" rx="6" fill="url(#cyanGrad)"/>
    <rect x="170" y="105" width="30" height="110" rx="6" fill="url(#cyanGrad)"/>
    <rect x="230" y="105" width="30" height="110" rx="6" fill="#F8FAFC"/>
    <rect x="20" y="225" width="260" height="24" rx="6" fill="url(#goldGrad)"/>

    <!-- Offline-First Sync Nodes overlay -->
    <circle cx="150" cy="275" r="22" fill="#10B981"/>
    <path d="M142 275 L148 281 L159 270" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Pulse rings representing Local-First offline and sync -->
    <path d="M110 275 A 40 40 0 0 1 190 275" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4"/>
  </g>

  <!-- App Title Typography in SVG -->
  <text x="256" y="440" font-family="sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MeDo ERP</text>
  <text x="256" y="472" font-family="sans-serif" font-size="16" font-weight="700" fill="#D4AF37" text-anchor="middle">OFFLINE-FIRST HYBRID</text>
</svg>
