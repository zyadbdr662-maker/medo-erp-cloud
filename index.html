<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        var isViteHmr = function(msg) {
          if (!msg) return false;
          var s = '';
          if (typeof msg === 'string') s = msg;
          else if (msg && msg.message) s = String(msg.message);
          else s = String(msg);
          return s.indexOf('[vite]') !== -1 ||
                 s.indexOf('failed to connect to websocket') !== -1 ||
                 s.indexOf('WebSocket connection') !== -1 ||
                 s.indexOf('vite-hmr') !== -1 ||
                 s.indexOf('vite-ping') !== -1;
        };

        window.addEventListener('error', function(e) {
          if (isViteHmr(e.message) || (e.error && isViteHmr(e.error.message)) || (e.filename && e.filename.indexOf('@vite/client') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteHmr(e.reason) || (e.reason && isViteHmr(e.reason.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        var _origErr = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteHmr(arguments[i]) || (arguments[i] && typeof arguments[i] === 'object' && isViteHmr(arguments[i].message))) {
              return;
            }
          }
          _origErr.apply(console, arguments);
        };

        var _origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteHmr(arguments[i]) || (arguments[i] && typeof arguments[i] === 'object' && isViteHmr(arguments[i].message))) {
              return;
            }
          }
          _origWarn.apply(console, arguments);
        };
      })();
    </script>
